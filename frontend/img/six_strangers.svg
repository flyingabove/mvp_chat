<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Six Strangers</title>
  <desc id="desc">Six housemate silhouettes in a glass-fronted modern Tokyo house at dusk.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#111b35"/><stop offset="1" stop-color="#5c637b"/></linearGradient>
    <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#d8c6a5"/><stop offset="1" stop-color="#7b8f99"/></linearGradient>
    <linearGradient id="shade" x2="0" y2="1"><stop stop-color="#101e31" stop-opacity="0"/><stop offset="1" stop-color="#0b1425"/></linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <circle cx="672" cy="72" r="22" fill="#f7eedc"/>
  <g fill="#26334c"><path d="M0 230V150H45V185H73V113H116V230ZM626 230V148H654V110H702V170H746V133H800V230Z"/></g>
  <g fill="#e5c78e" opacity=".6"><path d="M83 131H91V140H83ZM102 151H110V160H102ZM665 128H673V137H665ZM684 152H692V161H684ZM767 151H775V160H767Z"/></g>
  <!-- A multi-level house, with a furnished rooftop and open glass living floor. -->
  <path d="M128 315V159H182V98H551V134H675V315Z" fill="#d6d9d8"/>
  <rect x="196" y="111" width="340" height="42" fill="#425668"/>
  <path d="M195 123H538M222 111V153M511 111V153" stroke="#b0c1c9" stroke-width="3"/>
  <path d="M275 148V134H313V148M423 148V134H461V148" fill="none" stroke="#ddc4a1" stroke-width="6"/>
  <rect x="147" y="178" width="507" height="114" fill="url(#glass)"/>
  <path d="M316 178V292M485 178V292" stroke="#dae1df" stroke-width="8"/>
  <path d="M154 184L264 286M505 184L615 286" stroke="#f0f7fa" stroke-width="15" opacity=".13"/>
  <rect x="160" y="275" width="479" height="6" fill="#e5ceb0"/>
  <path d="M177 276V251H255V276M529 276V251H608V276" fill="#697875"/>
  <!-- Exactly six residents; the player is the arriving seventh housemate. -->
  <g fill="#172b3b">
    <g id="resident-1"><circle cx="211" cy="222" r="12"/><path d="M190 274Q190 237 204 236H218Q232 240 232 274Z"/></g>
    <g id="resident-2"><ellipse cx="282" cy="224" rx="12" ry="15"/><path d="M264 274Q264 241 277 239H287Q299 244 303 274Z"/></g>
    <g id="resident-3"><circle cx="357" cy="216" r="12"/><path d="M337 274Q337 233 350 230H364Q378 234 378 274Z"/></g>
    <g id="resident-4"><ellipse cx="427" cy="225" rx="13" ry="15"/><path d="M407 274Q409 243 421 239H433Q446 244 448 274Z"/></g>
    <g id="resident-5"><circle cx="504" cy="218" r="12"/><path d="M484 274Q484 237 497 232H511Q525 238 525 274Z"/></g>
    <g id="resident-6"><ellipse cx="575" cy="224" rx="12" ry="15"/><path d="M555 274Q556 241 569 238H581Q594 242 595 274Z"/></g>
  </g>
  <rect x="128" y="292" width="547" height="14" fill="#f0ebe1"/>
  <path d="M93 316H710L754 366H48Z" fill="#18283b"/>
  <rect y="301" width="800" height="149" fill="url(#shade)"/>
  <text x="400" y="359" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" letter-spacing="4" fill="#cbd8e4">TOKYO / 2015</text>
  <text x="400" y="404" text-anchor="middle" font-family="Georgia,serif" font-size="37" fill="#fff4df">Six Strangers</text>
  <text x="400" y="433" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" letter-spacing="3" fill="#abc8d8">SIX HOUSEMATES. YOUR NEXT CHAPTER.</text>
</svg>
