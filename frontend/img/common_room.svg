<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1a0e"/>
      <stop offset="55%" stop-color="#4a2a12"/>
      <stop offset="100%" stop-color="#1a0f08"/>
    </linearGradient>
    <radialGradient id="lamp" cx="30%" cy="35%" r="35%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2a1a0e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm2" cx="72%" cy="55%" r="30%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2a1a0e" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#lamp)"/>
  <rect width="800" height="450" fill="url(#warm2)"/>

  <!-- Window with evening sky -->
  <rect x="560" y="40" width="200" height="180" fill="#1a0f08" rx="3"/>
  <rect x="565" y="45" width="190" height="170" fill="#2f2350" rx="2"/>
  <line x1="660" y1="45" x2="660" y2="215" stroke="#1a0f08" stroke-width="4"/>
  <line x1="565" y1="130" x2="755" y2="130" stroke="#1a0f08" stroke-width="4"/>
  <circle cx="700" cy="80" r="18" fill="#fde68a" opacity="0.5"/>

  <!-- Floor -->
  <rect x="0" y="300" width="800" height="150" fill="#1a0f08" opacity="0.9"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#4a2a12" stroke-width="1" opacity="0.5"/>

  <!-- Couch -->
  <rect x="70" y="250" width="300" height="60" fill="#7c3f22" rx="10"/>
  <rect x="60" y="222" width="40" height="88" fill="#6a3419" rx="8"/>
  <rect x="360" y="222" width="40" height="88" fill="#6a3419" rx="8"/>
  <rect x="90" y="256" width="85" height="32" fill="#8a4d2c" rx="8"/>
  <rect x="190" y="258" width="80" height="30" fill="#8a4d2c" rx="8"/>
  <rect x="280" y="256" width="70" height="32" fill="#8a4d2c" rx="8"/>

  <!-- Three housemate silhouettes on/around couch -->
  <ellipse cx="150" cy="205" rx="24" ry="27" fill="#1a0f08"/>
  <path d="M138,225 Q132,248 130,268 L172,268 Q170,248 164,225 Z" fill="#1a0f08"/>

  <ellipse cx="245" cy="198" rx="24" ry="27" fill="#1a0f08"/>
  <path d="M233,218 Q227,244 225,268 L267,268 Q265,244 259,218 Z" fill="#1a0f08"/>

  <ellipse cx="330" cy="207" rx="22" ry="25" fill="#1a0f08"/>
  <path d="M319,226 Q313,248 311,268 L349,268 Q347,248 341,226 Z" fill="#1a0f08"/>

  <!-- Coffee table with mugs -->
  <rect x="430" y="285" width="140" height="10" fill="#3a2010" rx="2"/>
  <rect x="440" y="295" width="8" height="20" fill="#2a1608"/>
  <rect x="552" y="295" width="8" height="20" fill="#2a1608"/>
  <ellipse cx="470" cy="278" rx="10" ry="6" fill="#4a2a12"/>
  <ellipse cx="500" cy="280" rx="10" ry="6" fill="#4a2a12"/>

  <!-- Plant -->
  <path d="M620,300 Q610,260 600,240 M620,300 Q625,255 640,230 M620,300 Q635,265 645,245" stroke="#4ade80" stroke-width="4" fill="none" opacity="0.7" stroke-linecap="round"/>
  <rect x="605" y="298" width="30" height="24" fill="#8a4d2c" rx="3"/>

  <!-- String lights across the top -->
  <path d="M20,30 Q400,10 780,30" stroke="#7c3f22" stroke-width="2" fill="none" opacity="0.6"/>
  <circle cx="100" cy="27" r="4" fill="#fde68a" opacity="0.8"/>
  <circle cx="220" cy="20" r="4" fill="#fb923c" opacity="0.8"/>
  <circle cx="340" cy="15" r="4" fill="#fde68a" opacity="0.8"/>
  <circle cx="460" cy="15" r="4" fill="#fb923c" opacity="0.8"/>
  <circle cx="580" cy="19" r="4" fill="#fde68a" opacity="0.8"/>
  <circle cx="700" cy="27" r="4" fill="#fb923c" opacity="0.8"/>

  <!-- Accent edges -->
  <rect x="0" y="0" width="4" height="450" fill="#fb923c" opacity="0.5"/>
  <rect x="796" y="0" width="4" height="450" fill="#fde68a" opacity="0.35"/>

  <!-- Title bar -->
  <rect x="0" y="370" width="800" height="80" fill="#1a0f08" opacity="0.92"/>
  <text x="400" y="405" font-family="Georgia,serif" font-size="28" fill="#fef3c7" text-anchor="middle" font-weight="bold">The Common Room</text>
  <text x="400" y="430" font-family="Arial,sans-serif" font-size="12" fill="#fde68a" text-anchor="middle" letter-spacing="5">SLICE OF LIFE</text>
</svg>
