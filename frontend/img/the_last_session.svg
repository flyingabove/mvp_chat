<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080c10"/>
      <stop offset="50%" style="stop-color:#0a1015"/>
      <stop offset="100%" style="stop-color:#060810"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="30%" r="30%">
      <stop offset="0%" style="stop-color:#ffe8b0;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#080c10;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#lamp)"/>
  <!-- Therapy room: desk, chair, couch -->
  <!-- Desk lamp light cone -->
  <polygon points="380,100 340,280 460,280 420,100" fill="#ffe8b0" opacity="0.06"/>
  <!-- Lamp -->
  <rect x="393" y="85" width="14" height="8" fill="#888880" rx="2"/>
  <rect x="399" y="60" width="4" height="28" fill="#666660"/>
  <ellipse cx="401" cy="90" rx="20" ry="8" fill="#aaaaaa" opacity="0.7"/>
  <!-- Desk -->
  <rect x="300" y="275" width="200" height="15" fill="#1a1208" rx="2"/>
  <rect x="310" y="290" width="8" height="100" fill="#110d05"/>
  <rect x="482" y="290" width="8" height="100" fill="#110d05"/>
  <!-- Papers on desk -->
  <rect x="330" y="260" width="60" height="14" fill="#e8e0cc" opacity="0.25" rx="1"/>
  <rect x="400" y="265" width="50" height="10" fill="#e8e0cc" opacity="0.2" rx="1"/>
  <!-- Chair silhouette -->
  <rect x="490" y="230" width="70" height="80" fill="#0d1018" rx="5"/>
  <rect x="485" y="310" width="80" height="10" fill="#0d1018" rx="3"/>
  <rect x="495" y="320" width="10" height="60" fill="#0d1018"/>
  <rect x="555" y="320" width="10" height="60" fill="#0d1018"/>
  <!-- Couch silhouette left -->
  <rect x="220" y="260" width="70" height="60" fill="#0f0f14" rx="5"/>
  <rect x="215" y="255" width="80" height="15" fill="#0f0f14" rx="4"/>
  <rect x="215" y="255" width="12" height="65" fill="#0f0f14" rx="3"/>
  <rect x="283" y="255" width="12" height="65" fill="#0f0f14" rx="3"/>
  <!-- Window with blinds -->
  <rect x="120" y="100" width="100" height="130" fill="#0c1525" rx="2"/>
  <line x1="120" y1="115" x2="220" y2="115" stroke="#0a1020" stroke-width="3"/>
  <line x1="120" y1="128" x2="220" y2="128" stroke="#0a1020" stroke-width="3"/>
  <line x1="120" y1="141" x2="220" y2="141" stroke="#0a1020" stroke-width="3"/>
  <line x1="120" y1="154" x2="220" y2="154" stroke="#0a1020" stroke-width="3"/>
  <line x1="120" y1="167" x2="220" y2="167" stroke="#0a1020" stroke-width="3"/>
  <line x1="120" y1="180" x2="220" y2="180" stroke="#0a1020" stroke-width="3"/>
  <line x1="120" y1="193" x2="220" y2="193" stroke="#0a1020" stroke-width="3"/>
  <line x1="120" y1="206" x2="220" y2="206" stroke="#0a1020" stroke-width="3"/>
  <line x1="120" y1="219" x2="220" y2="219" stroke="#0a1020" stroke-width="3"/>
  <!-- Text -->
  <text x="400" y="395" font-family="Georgia,serif" font-size="22" fill="#ffe8b0" text-anchor="middle" opacity="0.85">The Last Session</text>
  <text x="400" y="420" font-family="Arial,sans-serif" font-size="13" fill="#cc9944" text-anchor="middle" opacity="0.7">PSYCHOLOGICAL THRILLER</text>
</svg>
