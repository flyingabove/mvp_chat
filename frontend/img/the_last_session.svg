<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c0808"/>
      <stop offset="50%" stop-color="#2a0e0e"/>
      <stop offset="100%" stop-color="#0d0404"/>
    </linearGradient>
    <radialGradient id="lamp" cx="38%" cy="30%" r="30%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1c0808" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="warmglow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- Background — dark therapy office -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#lamp)"/>

  <!-- Wall texture — wainscoting -->
  <rect x="0" y="260" width="800" height="4" fill="#3d1515" opacity="0.6"/>
  <rect x="0" y="264" width="800" height="186" fill="#150606" opacity="0.5"/>

  <!-- Bookshelf (left wall) -->
  <rect x="40" y="80" width="130" height="180" fill="#1a0808" rx="3"/>
  <rect x="38" y="78" width="134" height="6" fill="#2a0e0e" rx="2"/>
  <!-- Shelves -->
  <line x1="42" y1="120" x2="168" y2="120" stroke="#2a0e0e" stroke-width="3"/>
  <line x1="42" y1="160" x2="168" y2="160" stroke="#2a0e0e" stroke-width="3"/>
  <line x1="42" y1="200" x2="168" y2="200" stroke="#2a0e0e" stroke-width="3"/>
  <line x1="42" y1="240" x2="168" y2="240" stroke="#2a0e0e" stroke-width="3"/>
  <!-- Books -->
  <rect x="48" y="86" width="8" height="32" fill="#4a1a1a" rx="1"/>
  <rect x="58" y="88" width="10" height="30" fill="#1c3549" rx="1"/>
  <rect x="70" y="85" width="7" height="33" fill="#3d1515" rx="1"/>
  <rect x="79" y="87" width="12" height="31" fill="#2d3a1a" rx="1"/>
  <rect x="95" y="86" width="9" height="32" fill="#4a1a1a" rx="1"/>
  <rect x="110" y="88" width="8" height="30" fill="#1a2d49" rx="1"/>
  <rect x="122" y="85" width="11" height="33" fill="#3d2815" rx="1"/>
  <rect x="48" y="125" width="10" height="33" fill="#1c3549" rx="1"/>
  <rect x="62" y="127" width="8" height="31" fill="#4a1a1a" rx="1"/>
  <rect x="74" y="124" width="12" height="34" fill="#3d1515" rx="1"/>
  <rect x="92" y="126" width="7" height="32" fill="#2d3a1a" rx="1"/>
  <rect x="104" y="125" width="10" height="33" fill="#1a2d49" rx="1"/>
  <rect x="120" y="127" width="9" height="31" fill="#4a2a1a" rx="1"/>

  <!-- Framed diploma on wall -->
  <rect x="220" y="100" width="70" height="55" fill="#1a0808" rx="2"/>
  <rect x="222" y="102" width="66" height="51" fill="none" stroke="#4a2a1a" stroke-width="2" rx="1"/>
  <line x1="235" y1="115" x2="275" y2="115" stroke="#3d1515" stroke-width="1" opacity="0.5"/>
  <line x1="238" y1="125" x2="272" y2="125" stroke="#3d1515" stroke-width="1" opacity="0.4"/>
  <line x1="240" y1="135" x2="270" y2="135" stroke="#3d1515" stroke-width="1" opacity="0.3"/>

  <!-- Desk lamp (casting the warm cone of light) -->
  <rect x="285" y="52" width="6" height="40" fill="#4a2a1a"/>
  <ellipse cx="288" cy="48" rx="32" ry="14" fill="#b8860b" opacity="0.85"/>
  <ellipse cx="288" cy="52" rx="28" ry="10" fill="#fef08a" opacity="0.6" filter="url(#glow)"/>
  <!-- Light cone -->
  <polygon points="260,52 220,260 356,260 316,52" fill="#fef08a" opacity="0.04"/>
  <!-- Lamp base -->
  <ellipse cx="288" cy="92" rx="18" ry="5" fill="#3d1515"/>

  <!-- Desk -->
  <rect x="200" y="258" width="260" height="16" fill="#2a0e0e" rx="3"/>
  <rect x="210" y="274" width="12" height="80" fill="#2a0e0e" rx="2"/>
  <rect x="440" y="274" width="12" height="80" fill="#2a0e0e" rx="2"/>

  <!-- Items on desk -->
  <!-- Notepad -->
  <rect x="220" y="240" width="45" height="18" fill="#f5f0e0" opacity="0.5" rx="1"/>
  <line x1="225" y1="246" x2="258" y2="246" stroke="#4a2a1a" stroke-width="0.5" opacity="0.4"/>
  <line x1="225" y1="250" x2="252" y2="250" stroke="#4a2a1a" stroke-width="0.5" opacity="0.3"/>
  <!-- Pen -->
  <rect x="270" y="242" width="3" height="16" fill="#1a0808" transform="rotate(-20, 271, 250)" rx="1"/>
  <!-- Coffee cup -->
  <ellipse cx="340" cy="248" rx="12" ry="5" fill="#2a0e0e"/>
  <rect x="328" y="240" width="24" height="18" fill="#2a0e0e" rx="2"/>
  <ellipse cx="340" cy="240" rx="12" ry="5" fill="#1c0808"/>
  <ellipse cx="340" cy="241" rx="9" ry="3.5" fill="#3d1515" opacity="0.7"/>
  <!-- Tissue box -->
  <rect x="395" y="242" width="30" height="16" fill="#f5f0e0" opacity="0.3" rx="2"/>

  <!-- Therapy couch (right side) -->
  <rect x="520" y="240" width="230" height="40" fill="#1a0808" rx="8"/>
  <rect x="510" y="220" width="45" height="60" fill="#1a0808" rx="6"/>
  <rect x="720" y="225" width="35" height="55" fill="#1a0808" rx="6"/>
  <!-- Pillow -->
  <ellipse cx="545" cy="235" rx="22" ry="10" fill="#2a0e0e"/>

  <!-- Figure on couch (patient, lying down — head near pillow) -->
  <ellipse cx="555" cy="222" rx="13" ry="15" fill="#0d0404"/>
  <path d="M568,230 Q610,228 660,232 Q690,235 710,240" stroke="#0d0404" stroke-width="18" fill="none" stroke-linecap="round"/>
  <!-- Arm hanging off couch -->
  <path d="M620,240 Q622,260 618,275" stroke="#0d0404" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Empty therapist chair (she's dead) -->
  <rect x="350" y="305" width="60" height="45" fill="#1a0808" rx="6"/>
  <rect x="348" y="290" width="64" height="18" fill="#1a0808" rx="4"/>
  <rect x="352" y="350" width="10" height="30" fill="#1a0808" rx="2"/>
  <rect x="396" y="350" width="10" height="30" fill="#1a0808" rx="2"/>
  <!-- Chair is slightly turned, empty — ominous -->

  <!-- Clock on wall (stopped) -->
  <circle cx="630" cy="100" r="32" fill="none" stroke="#3d1515" stroke-width="2.5" opacity="0.6"/>
  <circle cx="630" cy="100" r="28" fill="#1a0808"/>
  <!-- Clock hands frozen -->
  <line x1="630" y1="100" x2="630" y2="78" stroke="#fef08a" stroke-width="2" opacity="0.4"/>
  <line x1="630" y1="100" x2="648" y2="108" stroke="#fef08a" stroke-width="1.5" opacity="0.3"/>
  <circle cx="630" cy="100" r="2" fill="#fef08a" opacity="0.5"/>
  <!-- 12 hour markers -->
  <circle cx="630" cy="74" r="1.5" fill="#3d1515" opacity="0.5"/>
  <circle cx="656" cy="100" r="1.5" fill="#3d1515" opacity="0.5"/>
  <circle cx="630" cy="126" r="1.5" fill="#3d1515" opacity="0.5"/>
  <circle cx="604" cy="100" r="1.5" fill="#3d1515" opacity="0.5"/>

  <!-- Subtle red stain on floor near desk (blood?) -->
  <ellipse cx="320" cy="370" rx="25" ry="8" fill="#6b0000" opacity="0.2" filter="url(#blur)"/>

  <!-- "Your memories keep changing" — subtle visual glitch -->
  <rect x="0" y="170" width="800" height="1" fill="#dc2626" opacity="0.08"/>
  <rect x="0" y="172" width="400" height="1" fill="#dc2626" opacity="0.05"/>

  <!-- Floor -->
  <rect x="0" y="355" width="800" height="95" fill="#0d0404" opacity="0.7"/>

  <!-- Accent edges -->
  <rect x="0" y="0" width="4" height="450" fill="#dc2626" opacity="0.5"/>
  <rect x="796" y="0" width="4" height="450" fill="#dc2626" opacity="0.35"/>

  <!-- Title bar -->
  <rect x="0" y="370" width="800" height="80" fill="#0d0404" opacity="0.92"/>
  <text x="400" y="405" font-family="Georgia,serif" font-size="28" fill="#fef2f2" text-anchor="middle" font-weight="bold">The Last Session</text>
  <text x="400" y="430" font-family="Arial,sans-serif" font-size="12" fill="#fca5a5" text-anchor="middle" letter-spacing="5">PSYCHOLOGICAL THRILLER</text>
</svg>