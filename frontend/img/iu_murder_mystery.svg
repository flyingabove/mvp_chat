<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3c0a70"/>
      <stop offset="100%" style="stop-color:#5a1090"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="45%" r="40%">
      <stop offset="0%" style="stop-color:#aa44ff;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#3c0a70;stop-opacity:0"/>
    </radialGradient>
    <filter id="gf"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- Vivid deep purple background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#spot)"/>
  <!-- Floor -->
  <rect x="0" y="300" width="800" height="150" fill="#2a0550" opacity="0.7"/>
  <!-- Police tape - VERY prominent, spans center -->
  <rect x="0" y="268" width="800" height="22" fill="#ffe000" opacity="0.92"/>
  <text x="30" y="284" font-family="Arial Black,sans-serif" font-size="12" fill="#2a0060" font-weight="900" letter-spacing="5">POLICE LINE DO NOT CROSS  POLICE LINE DO NOT CROSS  POLICE LINE DO NOT CROSS</text>
  <rect x="0" y="304" width="800" height="14" fill="#ffe000" opacity="0.78"/>
  <!-- Dark building/window silhouette (center) -->
  <rect x="270" y="60" width="260" height="230" fill="#1e0040" opacity="0.85" rx="3"/>
  <!-- Window cross -->
  <line x1="400" y1="60" x2="400" y2="290" stroke="#2d0060" stroke-width="10"/>
  <line x1="270" y1="170" x2="530" y2="170" stroke="#2d0060" stroke-width="10"/>
  <!-- Window glow (top-left pane) -->
  <rect x="278" y="68" width="114" height="94" fill="#cc88ff" opacity="0.2"/>
  <!-- Dark figure silhouette -->
  <ellipse cx="400" cy="140" rx="28" ry="32" fill="#1a0038"/>
  <rect x="372" y="172" width="56" height="80" fill="#1a0038" rx="8"/>
  <!-- Red evidence markers (center-visible) -->
  <polygon points="340,305 352,287 364,305" fill="#ff2244"/>
  <text x="343" y="303" font-family="Arial,sans-serif" font-size="11" fill="white" font-weight="bold">1</text>
  <polygon points="430,312 442,294 454,312" fill="#ff2244"/>
  <text x="433" y="310" font-family="Arial,sans-serif" font-size="11" fill="white" font-weight="bold">2</text>
  <!-- Pink accent borders -->
  <rect x="0" y="0" width="8" height="450" fill="#ff44cc" opacity="0.6"/>
  <rect x="792" y="0" width="8" height="450" fill="#ff44cc" opacity="0.4"/>
  <!-- Title block at bottom -->
  <rect x="0" y="365" width="800" height="85" fill="#2a0550" opacity="0.75"/>
  <text x="400" y="403" font-family="Georgia,serif" font-size="28" fill="#f0ccff" text-anchor="middle" font-weight="bold">IU: Murder Mystery</text>
  <text x="400" y="427" font-family="Arial,sans-serif" font-size="13" fill="#cc88ff" text-anchor="middle" letter-spacing="3">CRIME DRAMA</text>
</svg>
