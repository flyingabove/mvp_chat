<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080808"/>
      <stop offset="60%" style="stop-color:#0f0a00"/>
      <stop offset="100%" style="stop-color:#080808"/>
    </linearGradient>
    <radialGradient id="moon" cx="75%" cy="20%" r="15%">
      <stop offset="0%" style="stop-color:#ffffcc;stop-opacity:0.9"/>
      <stop offset="60%" style="stop-color:#ffeeaa;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#080808;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Moon glow -->
  <circle cx="600" cy="90" r="40" fill="#ffffee" opacity="0.12" filter="url(#blur)"/>
  <circle cx="600" cy="90" r="28" fill="#ffffcc" opacity="0.7"/>
  <!-- Storm clouds -->
  <ellipse cx="200" cy="80" rx="150" ry="50" fill="#1a1a1a" opacity="0.8"/>
  <ellipse cx="500" cy="60" rx="200" ry="60" fill="#111111" opacity="0.7"/>
  <!-- Manor silhouette -->
  <rect x="250" y="180" width="300" height="270" fill="#050505"/>
  <!-- Towers -->
  <rect x="250" y="130" width="60" height="320" fill="#080808"/>
  <rect x="490" y="150" width="60" height="300" fill="#080808"/>
  <!-- Roof points -->
  <polygon points="250,130 280,80 310,130" fill="#060606"/>
  <polygon points="490,150 520,100 550,150" fill="#060606"/>
  <!-- Windows with eerie light -->
  <rect x="270" y="170" width="25" height="30" fill="#996600" opacity="0.4"/>
  <rect x="270" y="220" width="25" height="30" fill="#110800" opacity="0.8"/>
  <rect x="340" y="200" width="30" height="40" fill="#cc8800" opacity="0.25"/>
  <rect x="390" y="200" width="30" height="40" fill="#550000" opacity="0.5"/>
  <rect x="505" y="180" width="25" height="30" fill="#996600" opacity="0.35"/>
  <!-- Front door -->
  <rect x="365" y="320" width="70" height="130" fill="#0d0800" rx="35"/>
  <!-- Ground -->
  <rect x="0" y="420" width="800" height="30" fill="#050505"/>
  <!-- Text -->
  <text x="400" y="395" font-family="Georgia,serif" font-size="22" fill="#cc9900" text-anchor="middle" opacity="0.9">Blackout Manor</text>
  <text x="400" y="420" font-family="Arial,sans-serif" font-size="13" fill="#997700" text-anchor="middle" opacity="0.7">LOCKED ROOM MYSTERY</text>
</svg>
