<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drama Theatre</title>
<style>
  :root { --bg:#141414; --panel:#1e1e1e; --panel2:#262626; --text:#ececec; --dim:#9a9a9a; --red:#e50914; --line:#2f2f2f; --gold:#e8b04a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display:flex; flex-direction:column; height:100dvh; }
  header { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; letter-spacing:.02em; }
  .chip { background:var(--panel2); border-radius:999px; padding:3px 10px; font-size:12px; color:var(--dim); white-space:nowrap; }
  .chip.clock { color:var(--text); }
  .spacer { flex:1; }
  button, select { font:inherit; color:var(--text); background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer; }
  button:hover:not(:disabled) { border-color:#555; }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:var(--red); border-color:var(--red); color:#fff; }
  button.on { background:var(--gold); border-color:var(--gold); color:#111; }
  #cast { display:flex; gap:8px; overflow-x:auto; padding:10px 14px; border-bottom:1px solid var(--line); scrollbar-width:thin; }
  .person { flex:0 0 auto; min-width:132px; max-width:190px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:7px 9px; cursor:pointer; }
  .person.here { border-color:var(--red); }
  .person .n { font-weight:600; font-size:13px; display:flex; align-items:center; gap:6px; }
  .dot { width:9px; height:9px; border-radius:50%; background:#555; flex:none; }
  .person .p { font-size:12px; color:var(--dim); }
  .person .d { font-size:11px; color:var(--gold); margin-top:4px; display:none; }
  body.director .person .d { display:block; }
  #feed { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; max-width:820px; width:100%; margin:0 auto; }
  .card .head { display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:12px; color:var(--dim); margin-bottom:8px; }
  .card .head b { color:var(--text); }
  .card p { margin:0 0 9px; }
  .card .sum { font-style:italic; color:var(--dim); font-size:13px; border-top:1px solid var(--line); padding-top:8px; margin-top:4px; }
  .tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .tag { font-size:11px; background:var(--panel2); border-radius:6px; padding:2px 7px; color:var(--dim); }
  .tag.up { color:#6fcf97; } .tag.down { color:#eb7777; }
  .also { font-size:12px; color:var(--dim); margin-top:6px; }
  .skip { text-align:center; color:var(--dim); font-size:13px; max-width:820px; width:100%; margin:0 auto; }
  .skip::before, .skip::after { content:""; display:inline-block; width:18%; height:1px; background:var(--line); vertical-align:middle; margin:0 10px; }
  .nudge { align-self:flex-end; background:var(--red); color:#fff; border-radius:14px 14px 3px 14px; padding:8px 12px; max-width:min(560px, 86%); }
  .nudge small { display:block; opacity:.75; font-size:11px; }
  .note { text-align:center; color:#eb7777; font-size:12px; }
  #status { text-align:center; color:var(--dim); font-size:13px; min-height:20px; }
  #bar { border-top:1px solid var(--line); padding:8px 12px calc(8px + env(safe-area-inset-bottom)); background:var(--bg); }
  #quick { display:flex; gap:6px; overflow-x:auto; padding-bottom:7px; }
  #quick button { flex:none; padding:6px 10px; font-size:13px; }
  #row { display:flex; gap:8px; }
  textarea { flex:1; resize:none; height:42px; max-height:110px; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:9px 11px; font:inherit; }
  #gate { margin:auto; text-align:center; max-width:420px; padding:24px; }
  #gate input { width:100%; padding:10px; margin:12px 0; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; font:inherit; }
  .hidden { display:none !important; }
  .dots::after { content:""; animation:d 1.2s steps(4,end) infinite; }
  @keyframes d { 0%{content:""} 25%{content:"."} 50%{content:".."} 75%{content:"..."} }
</style>
</head>
<body>
<header>
  <h1>🎭 Drama Theatre</h1>
  <span class="chip clock" id="clock">not started</span>
  <span class="chip" id="calls"></span>
  <span class="spacer"></span>
  <button id="directorBtn" title="Show each resident's private aim and feelings">Director view</button>
  <select id="replaySel" title="Replay a saved session"><option value="">Replay…</option></select>
  <button id="newBtn" class="primary">New season</button>
</header>

<div id="gate" class="hidden">
  <h2>Operator token needed</h2>
  <div class="chip">This admin page uses the same token as the debug page.</div>
  <input id="tokenIn" type="password" placeholder="Operator token" autocomplete="off">
  <button id="tokenBtn" class="primary">Save</button>
</div>

<div id="cast" class="hidden"></div>
<div id="feed"><div id="status">Press “New season” to start six housemates living their lives. They run by themselves; chat to nudge them.</div></div>

<div id="bar" class="hidden">
  <div id="quick">
    <button id="nextBtn" class="primary">▶ Next scene</button>
    <button id="autoBtn">⏵ Auto</button>
    <button data-say="skip to evening">⏭ Evening</button>
    <button data-say="skip to the next morning">⏭ Next morning</button>
    <button data-say="skip 3 hours">⏭ +3 h</button>
    <button data-say="skip a day">⏭ +1 day</button>
  </div>
  <div id="row">
    <textarea id="say" rows="1" placeholder="Nudge the drama (“Natsumi finds out about the budget”), whisper (“@yuto pick a fight”) or skip (“skip to evening”)…"></textarea>
    <button id="sendBtn" class="primary">Send</button>
  </div>
</div>

<script>
(() => {
  const API = '/beta/debug/theatre';
  const TOKEN_KEY = 'storieschat_operator_token';
  const $ = (id) => document.getElementById(id);
  const feed = $('feed');
  let tick = null;
  let sid = '', last = 0, busy = false, auto = false, replay = null, replayAt = 0, cast = [], here = new Set(), timer = null;

  const token = () => { try { return (localStorage.getItem(TOKEN_KEY) || '').trim(); } catch (e) { return ''; } };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const status = (html) => { const el = $('status'); if (el) el.innerHTML = html || ''; };

  async function call(path, opts) {
    const r = await fetch(API + path, Object.assign({headers: {'Content-Type': 'application/json', 'X-Operator-Token': token()}}, opts || {}));
    let body = {};
    try { body = await r.json(); } catch (e) { /* not JSON */ }
    if (r.status === 401 || r.status === 403) { showGate(); throw new Error('Operator token needed'); }
    if (!r.ok) throw new Error(body.detail || ('HTTP ' + r.status));
    return body;
  }

  function showGate() { $('gate').classList.remove('hidden'); $('cast').classList.add('hidden'); $('bar').classList.add('hidden'); feed.classList.add('hidden'); }
  function hideGate() { $('gate').classList.add('hidden'); feed.classList.remove('hidden'); }

  // ---- rendering -------------------------------------------------------------------------------------------------
  function renderCast() {
    const el = $('cast'); el.classList.toggle('hidden', !cast.length);
    el.innerHTML = cast.map((c) => `<div class="person ${here.has(c.id) ? 'here' : ''}" data-id="${esc(c.id)}">
      <div class="n"><span class="dot" style="background:${c.availability === 'asleep' ? '#444' : here.has(c.id) ? 'var(--red)' : '#6fcf97'}"></span>${esc(c.name)}</div>
      <div class="p">${esc(c.place || '—')}${c.availability === 'asleep' ? ' · asleep' : ''}</div>
      <div class="d">${esc((c.aim || '').replace('private aim: ', '').replace('; never announce it', ''))}${c.feelings && c.feelings.length ? '<br>' + esc(c.feelings.join('; ')) : ''}</div>
    </div>`).join('');
    el.querySelectorAll('.person').forEach((p) => p.addEventListener('click', () => {
      const first = (cast.find((c) => c.id === p.dataset.id) || {name: ''}).name.split(' ')[0];
      const box = $('say'); box.value = '@' + first.toLowerCase() + ' '; box.focus();
    }));
  }

  function nameOf(id) { const c = cast.find((x) => x.id === id); return c ? c.name.split(' ')[0] : id; }

  function tagFor(d) {
    const parts = [['trust', d.trust], ['affection', d.affection], ['suspicion', d.suspicion], ['fear', d.fear]].filter((x) => x[1]);
    return parts.map((x) => `<span class="tag ${x[1] > 0 ? 'up' : 'down'}">${esc(nameOf(d.a))} ▸ ${esc(nameOf(d.b))} ${x[0]} ${x[1] > 0 ? '+' : ''}${x[1]}</span>`).join('');
  }

  function beatHtml(b) {
    if (b.type === 'scene') {
      const people = (b.people || []).map((p) => `<span class="chip">${esc(p.name)}</span>`).join(' ');
      const paras = String(b.text || '').split(/\n\s*\n/).map((p) => `<p>${esc(p.trim())}</p>`).join('');
      const deltas = (b.deltas || []).map(tagFor).join('');
      const moves = (b.moves || []).map((m) => `<span class="tag">${esc(m[0])} → ${esc(m[1])}</span>`).join('');
      const also = (b.also || []).length ? `<div class="also">Meanwhile: ${esc(b.also.join('; '))}.</div>` : '';
      return `<div class="card"><div class="head"><b>${esc(b.clock)}</b> · ${esc(b.place)} ${people}</div>${paras}
        <div class="sum">${esc(b.summary)}</div><div class="tags">${deltas}${moves}</div>${also}</div>`;
    }
    if (b.type === 'skip') {
      const also = (b.also || []).length ? `<div class="also" style="text-align:center">Meanwhile: ${esc(b.also.join('; '))}.</div>` : '';
      return `<div><div class="skip">⏭ ${esc(b.text)}</div>${also}</div>`;
    }
    if (b.type === 'nudge') return `<div class="nudge"><small>you nudged</small>${esc(b.text)}</div>`;
    return `<div class="note">${esc(b.text)}</div>`;
  }

  function append(beats) {
    if (!beats.length) return;
    const stick = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 140;
    const st = $('status'); if (st) st.remove();
    const wrap = document.createElement('div'); wrap.style.display = 'contents';
    wrap.innerHTML = beats.map(beatHtml).join('');
    feed.appendChild(wrap);
    const lastScene = [...beats].reverse().find((b) => b.type === 'scene');
    if (lastScene) here = new Set((lastScene.people || []).map((p) => p.id));
    if (stick || beats.some((b) => b.type === 'nudge')) feed.scrollTop = feed.scrollHeight;
  }

  function apply(state) {
    sid = state.id; cast = state.cast || cast;
    $('clock').textContent = state.clock || '';
    $('calls').textContent = state.call_cap ? `${state.calls}/${state.call_cap} model calls` : '';
    append(state.beats || []); last = state.last || last;
    renderCast();
  }

  function setBusy(on, text) {
    busy = on; ['nextBtn', 'sendBtn'].forEach((id) => { $(id).disabled = on; });
    document.querySelectorAll('#quick [data-say]').forEach((b) => { b.disabled = on; });
    clearInterval(tick);
    if (on) {
      const s = document.createElement('div'); s.id = 'status'; s.innerHTML = `${esc(text)}<span class="dots"></span> <small></small>`;
      const old = $('status'); if (old) old.remove(); feed.appendChild(s); feed.scrollTop = feed.scrollHeight;
      const t0 = Date.now();   // a scene is two model calls and can take a minute: show that it is alive
      tick = setInterval(() => { const sec = Math.round((Date.now() - t0) / 1000); s.querySelector('small').textContent = sec >= 8 ? `${sec}s (the writer can take up to a minute)` : ''; }, 1000);
    } else { const s = $('status'); if (s) s.remove(); }
  }

  // ---- live session ----------------------------------------------------------------------------------------------
  async function run(text, fn) {
    if (busy || (!sid && !replay)) return false;
    setBusy(true, text);
    try { apply(await fn()); setBusy(false); return true; }
    catch (e) { setBusy(false); auto = false; syncAuto(); const n = document.createElement('div'); n.className = 'note'; n.textContent = e.message; feed.appendChild(n); feed.scrollTop = feed.scrollHeight; return false; }
  }

  const step = () => replay ? replayStep() : run('Writing the next scene', () => call(`/${sid}/step?since=${last}`, {method: 'POST'}));
  const say = (text, thenStep) => run(thenStep ? 'Writing the next scene' : 'Moving time', () => call(`/${sid}/say?since=${last}`, {method: 'POST', body: JSON.stringify({text, then_step: !!thenStep})}));

  async function newSeason() {
    stopAuto(); replay = null; feed.innerHTML = ''; last = 0; here = new Set(); cast = [];
    feed.insertAdjacentHTML('beforeend', '<div id="status"></div>');
    hideGate(); $('bar').classList.remove('hidden');
    setBusy(true, 'Building the house');
    try { apply(await call('/start', {method: 'POST', body: JSON.stringify({story: 'six_strangers'})})); setBusy(false); status('Six housemates are about to live their lives. Press ▶ Next scene, or ⏵ Auto to let it run.'); loadSessions(); }
    catch (e) { setBusy(false); status(esc(e.message)); }
  }

  // ---- auto play -------------------------------------------------------------------------------------------------
  function syncAuto() { $('autoBtn').classList.toggle('on', auto); $('autoBtn').textContent = auto ? '⏸ Pause' : '⏵ Auto'; }
  function stopAuto() { auto = false; clearTimeout(timer); syncAuto(); }
  async function loop() {
    clearTimeout(timer);
    if (!auto) return;
    if ($('say').value.trim() === '' || replay) { const ok = await step(); if (!ok) return; }
    timer = setTimeout(loop, replay ? 2500 : 1500);
  }

  // ---- replay ----------------------------------------------------------------------------------------------------
  async function loadSessions() {
    try {
      const s = await call('/sessions');
      const sel = $('replaySel');
      sel.innerHTML = '<option value="">Replay…</option>' + (s.saved || []).map((x) => `<option value="${esc(x.id)}">${esc(x.id)} · ${x.scenes} scenes${x.live ? ' · live' : ''}</option>`).join('');
    } catch (e) { /* needs the token first */ }
  }
  async function startReplay(id) {
    stopAuto(); feed.innerHTML = ''; here = new Set(); cast = []; renderCast(); hideGate(); $('bar').classList.remove('hidden');
    try { replay = (await call('/replay/' + encodeURIComponent(id))).beats; replayAt = 0; $('clock').textContent = 'replay ' + id; $('calls').textContent = '';
      feed.insertAdjacentHTML('beforeend', '<div id="status">Replay: press ▶ Next scene to reveal each beat, or ⏵ Auto.</div>'); }
    catch (e) { status(esc(e.message)); }
  }
  async function replayStep() {
    if (!replay || replayAt >= replay.length) { stopAuto(); return false; }
    const beat = replay[replayAt++]; append([beat]); $('clock').textContent = beat.clock || '';
    renderCast(); return true;
  }

  // ---- wiring ----------------------------------------------------------------------------------------------------
  $('newBtn').onclick = newSeason;
  $('nextBtn').onclick = () => { stopAuto(); step(); };
  $('autoBtn').onclick = () => { auto = !auto; syncAuto(); if (auto) loop(); else clearTimeout(timer); };
  document.querySelectorAll('#quick [data-say]').forEach((b) => b.addEventListener('click', () => { if (!replay) say(b.dataset.say, false); }));
  $('directorBtn').onclick = () => { document.body.classList.toggle('director'); $('directorBtn').classList.toggle('on'); };
  $('replaySel').onchange = (e) => { if (e.target.value) startReplay(e.target.value); e.target.value = ''; };
  $('tokenBtn').onclick = () => { try { localStorage.setItem(TOKEN_KEY, $('tokenIn').value.trim()); } catch (e) { /* blocked */ } hideGate(); loadSessions(); };

  async function send() {
    const box = $('say'); const text = box.value.trim();
    if (!text || replay || !sid) return;
    box.value = '';
    // A skip command only moves time; anything else is a nudge, and the next scene is written right away so it lands.
    const isSkip = /^\/?(skip|jump|fast[- ]?forward|wait|time ?skip)\b/i.test(text) || /^(next day|tomorrow)$/i.test(text);
    if (!isSkip && !busy) {   // show the line at once; the server's own nudge bubble replaces it when the scene arrives
      const mine = document.createElement('div'); mine.className = 'nudge'; mine.id = 'pending-nudge';
      mine.innerHTML = `<small>you nudged</small>${esc(text)}`; feed.appendChild(mine); feed.scrollTop = feed.scrollHeight;
    }
    const ok = await say(text, !isSkip);
    const mine = $('pending-nudge'); if (mine) mine.remove();
    if (!ok && !isSkip) box.value = text;
  }
  $('sendBtn').onclick = send;
  $('say').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });

  if (!token()) showGate(); else loadSessions();
})();
</script>
</body>
</html>
