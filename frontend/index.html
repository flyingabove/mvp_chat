<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>storieschat.ai — Terminal (loading…)</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Automatically set base href based on environment -->
  <script>
    (function(){
      var host = window.location.hostname.toLowerCase();
      var path = window.location.pathname.toLowerCase();

      var isBeta =
        host.startsWith("beta.") ||
        path.includes("/beta/") ||
        path.endsWith("/beta");

      document.write('<base href="' + (isBeta ? "/beta/" : "/") + '">');
    })();
  </script>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    html, body {
      margin:0; padding:0; height:100%;
      background:#0c0c0c; color:#e6e6e6;
      font:16px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    #term {
      height:100vh; overflow:auto; padding:16px;
      -webkit-overflow-scrolling:touch;
      padding-bottom:88px;
    }
    .line { margin:0 0 8px 0; }
    .rich p { margin: 0 0 10px 0; }
    .rich p + p { margin-top: 6px; }
    .rich strong { font-weight: 700; }
    .rich em { font-style: italic; }
    .dialogue { display:inline; font-style: italic; }
    .sys{color:#77dd77;}
    .user{color:#8ab4f8;}
    .bot{color:#ffd466;}
    .err{color:#ff6b6b;}

    #inputline { position:relative; }
    #cursor {
      display:inline-block;
      width:8px;
      background:#e6e6e6;
      margin-left:2px;
      animation:blink 1s step-start infinite;
    }
    @keyframes blink { 50% { background:transparent; } }

    #ime {
      position:fixed;
      left:-9999px; top:-9999px;
      opacity:0; width:1px; height:1px;
    }

    #toolbar {
      position:fixed; left:0; right:0; bottom:0; z-index:3;
      display:flex; gap:8px; align-items:center;
      background:#0f0f0f; border-top:1px solid #222;
      padding:10px 12px;
      padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
    }
    #ghostInput {
      flex:1; min-height:40px;
      background:#121212; color:#e6e6e6;
      border:1px solid #333; border-radius:8px;
      padding:10px 12px; overflow:hidden;
      white-space:nowrap; text-overflow:ellipsis;
    }
    .btn {
      min-width:64px; height:40px;
      border-radius:8px;
      border:1px solid #2a2a2a;
      background:#1a1a1a;
      color:#e6e6e6;
      font-weight:600;
    }
    #errbox {
      position:fixed; left:8px; right:8px; bottom:96px;
      background:#330; color:#ffd;
      border:1px solid #662;
      padding:8px 10px;
      border-radius:6px;
      display:none; z-index:4;
      white-space:pre-wrap;
    }
  </style>
</head>

<body>
<div id="term" aria-label="terminal" role="region"></div>
<input id="ime" type="text" inputmode="text"
       autocapitalize="off" autocorrect="off" spellcheck="false" />

<div id="toolbar">
  <div id="ghostInput" aria-live="polite"></div>
  <button class="btn" id="enterBtn">Enter</button>
  <button class="btn" id="bkspBtn">⌫</button>
</div>

<div id="errbox"></div>

<script>
(function(){

  /* ---------------- ENV DETECTION ---------------- */
  var host = window.location.hostname.toLowerCase();
  var path = window.location.pathname.toLowerCase();
  var isBeta =
    host.startsWith("beta.") ||
    path.includes("/beta/") ||
    path.endsWith("/beta");

  var BASE = isBeta ? "/beta" : "";

  var endpoint = isBeta
    ? "https://beta-api.storieschat.ai/api/chat"
    : "https://api.storieschat.ai/api/chat";

  /* ---------------- VERSION ----------------
     IMPORTANT: version.json sits next to index.html in frontend folder.
     Because <base href="..."> is set above, the correct path is always "version.json".
  */
  var VERSION = "loading…";
  (function loadVersion(){
    fetch("version.json", {cache:"no-store"})
      .then(function(r){
        if (!r.ok) throw new Error("version.json not found");
        return r.json();
      })
      .then(function(j){
        VERSION = (j && j.version) ? j.version : "unknown";
        document.title = "terminal — storieschat.ai (version: " + VERSION + ")";
      })
      .catch(function(){
        VERSION = "unknown";
        document.title = "terminal — storieschat.ai (version: unknown)";
      });
  })();

  /* ---------------- ERROR HANDLING ---------------- */
  function showErr(msg){
    var box = document.getElementById("errbox");
    box.style.display = "block";
    box.textContent = String(msg);
  }
  window.onerror = (m,s,l,c)=>showErr("JS Error: "+m+" @ "+s+":"+l+":"+c);
  window.onunhandledrejection = e=>showErr("Promise rejection: "+(e?.reason||e));

  var term = document.getElementById("term");
  var ime  = document.getElementById("ime");
  var ghost= document.getElementById("ghostInput");
  var enterBtn = document.getElementById("enterBtn");
  var bkspBtn  = document.getElementById("bkspBtn");

  var state = {
    mode:"menu",
    sid: crypto.randomUUID ? crypto.randomUUID() : Date.now()+":"+Math.random(),
    turns:0, story:null, gender:null, playerName:null
  };

  /* -------- PROMPT / INPUT LOCKING -------- */
  var awaitingResponse = false;
  var hasPrompt = false;

  function newPrompt(){
    if (hasPrompt) return;
    hasPrompt = true;

    var l = document.createElement("div");
    l.id = "inputline";
    l.innerHTML =
      '<span class="sys">&gt; </span>' +
      '<span id="buffer"></span>' +
      '<span id="cursor">&nbsp;</span>';

    term.appendChild(l);
    scrollToBottom(true);
  }

  function removeInputLine(){
    var el = document.getElementById("inputline");
    if (el) el.remove();
    hasPrompt = false;
  }

  function unlockInput(){
    awaitingResponse = false;
    newPrompt();
    ime.focus();
  }

  /* -------- UI HELPERS -------- */
  function scrollToBottom(force){
    var d = term.scrollHeight - term.scrollTop - term.clientHeight;
    if (force || d < 80) term.scrollTop = term.scrollHeight;
  }

  function escapeHTML(s){
    return String(s)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#39;");
  }

  function formatInline(md){
    return md
      .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
      .replace(/(^|[^*])\*(.+?)\*(?!\*)/g,
        (_,p,i)=>p+"<em>"+i+"</em>")
      .replace(/"([^"]+)"/g,'<span class="dialogue">“$1”</span>')
      .replace(/“([^”]+)”/g,'<span class="dialogue">“$1”</span>');
  }

  function toRichHTML(text){
    var safe = escapeHTML(text||"").replace(/\r\n/g,"\n");
    return '<div class="rich">' +
      safe.split(/\n{2,}/).map(p =>
        "<p>"+formatInline(p.replace(/\n/g,"<br>"))+"</p>"
      ).join("") +
      "</div>";
  }

  function writeLine(text, cls){
    var d = document.createElement("div");
    if (cls) d.className = cls+" line";
    d.innerHTML = toRichHTML(text);
    term.appendChild(d);
    scrollToBottom(true);
  }

  function renderBuffer(){
    var b = document.getElementById("buffer");
    if (b) b.textContent = ime.value;
    ghost.textContent = ime.value || "";
  }

  /* -------- TYPEWRITER -------- */
  function typewrite(text, cls){
    return new Promise(resolve=>{
      var d = document.createElement("div");
      if (cls) d.className = cls+" line";
      term.appendChild(d);

      var i=0, s=String(text||"");
      (function step(){
        if (i >= s.length){
          d.innerHTML = toRichHTML(s);
          scrollToBottom(true);
          resolve();
          return;
        }
        i+=3;
        d.innerHTML = toRichHTML(s.slice(0,i));
        setTimeout(step,15);
      })();
    });
  }

  /* -------- SEND -------- */
  function send(msg, done){
    var xhr = new XMLHttpRequest();
    xhr.open("POST", endpoint, true);
    xhr.setRequestHeader("Content-Type","application/json");
    xhr.onreadystatechange = function(){
      if (xhr.readyState !== 4) return;

      if (xhr.status>=200 && xhr.status<300){
        var data;
        try { data = JSON.parse(xhr.responseText); }
        catch(e){ writeLine("Bad JSON","err"); done&&done(); return; }

        typewrite(data.reply||"", "bot").then(()=>done&&done());
      } else {
        writeLine("HTTP "+xhr.status+" — "+xhr.responseText,"err");
        done&&done();
      }
    };
    xhr.send(JSON.stringify({message:msg, session_id:state.sid}));
  }

  /* -------- INPUT FLOW -------- */
  function commitLine(){
    if (awaitingResponse) return;

    var line = ime.value.trim();
    ime.value="";
    renderBuffer();
    removeInputLine();

    if (!line){ newPrompt(); ime.focus(); return; }

    writeLine("> "+line,"user");

    if (state.mode==="menu") return handleMenu(line);
    if (state.mode==="name") return handleName(line);
    if (state.mode==="gender") return handleGender(line);

    awaitingResponse = true;
    send(line, unlockInput);
  }

  function handleMenu(line){
    if (line==="1"){
      state.mode="name";
      writeLine("Enter your name:","sys");
      newPrompt();
    } else {
      writeLine("Invalid choice.","sys");
      newPrompt();
    }
  }

  function handleName(line){
    state.playerName = line.replace(/[^A-Za-z\s\-']/g,"").slice(0,40);
    state.mode="gender";
    writeLine("Are you a girl (F) or boy (M)?","sys");
    newPrompt();
  }

  function handleGender(line){
    if (!/^[FM]$/i.test(line)){
      writeLine("Type F or M.","sys");
      newPrompt();
      return;
    }
    state.gender = line.toUpperCase();
    awaitingResponse = true;
    send("__cmd_newgame__:iu_murder_mystery|"+state.gender+"|"+state.playerName,
      function(){
        state.mode="chat";
        unlockInput();
      }
    );
  }

  /* -------- EVENTS -------- */
  ime.addEventListener("input", renderBuffer);
  document.addEventListener("keydown", e=>{
    if (e.key==="Enter"){ e.preventDefault(); commitLine(); }
  });
  enterBtn.onclick = commitLine;
  bkspBtn.onclick = ()=>{ ime.value=ime.value.slice(0,-1); renderBuffer(); };
  term.onclick = ()=>ime.focus();
  term.ontouchstart = ()=>ime.focus();

  writeLine("Choose a story (type the number and press Enter):","sys");
  writeLine("1) IU Murder Mystery — Echoes near Cheongdam","sys");
  newPrompt();
  ime.focus();

})();
</script>
</body>
</html>
