[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto


# =============================================================================
# POLICY: NO TESTS MAY BE SKIPPED — EVER
# =============================================================================
# All tests must run and pass locally. The deploy build (Docker gate) and CI
# unit job run `-m "not integration"` with no LLM keys and the conftest
# LLM-host block (TESTS_BLOCK_LLM_NETWORK=1): deploys never call LLM APIs.
# The conftest.py hook converts any skip attempt into a hard failure.
# If a test needs an API key, the key MUST be set in the environment.
#
# pytest.skip(), @pytest.mark.skip, @pytest.mark.skipif are all BANNED.
# =============================================================================


# =============================================================================
# Test Markers
# =============================================================================
markers =
    integration: end-to-end integration tests (require API keys)
    slow: slow-running tests

# =============================================================================
# Running Tests
# =============================================================================
#
# Run all tests:
#   pytest
#
# Run with verbose output:
#   pytest -v
#
# Run specific test file:
#   pytest tests/backend/integration/test_location_extractor_e2e.py
#
# =============================================================================
# Setup (required for ALL environments)
# =============================================================================
#
# Option 1: Local .env.test file
#   1. cp .env.test.example to .env.test
#   2. Edit .env.test and add your OPENAI_API_KEY
#
# Option 2: Environment variable
#   OPENAI_API_KEY=sk-xxx pytest
#
# Option 3: CI/CD (Railway, GitHub Actions)
#   Set OPENAI_API_KEY as an environment variable or secret
#
