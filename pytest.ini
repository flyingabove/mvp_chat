[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto


# =============================================================================
# Test Markers
# =============================================================================
markers =
    integration: end-to-end integration tests (require API keys)
    slow: slow-running tests

# =============================================================================
# Running Tests
# =============================================================================
#
# Run all unit tests (no API keys needed):
#   pytest
#
# Run integration tests (requires .env.test or OPENAI_API_KEY env var):
#   pytest -m integration
#
# Run all tests including integration:
#   pytest --run-integration
#
# Run with verbose output:
#   pytest -v
#
# Run specific test file:
#   pytest tests/backend/integration/test_location_extractor_e2e.py
#
# =============================================================================
# Setup for Integration Tests
# =============================================================================
#
# Option 1: Local .env.test file (recommended for development)
#   1. cp .env.test.example .env.test
#   2. Edit .env.test and add your OPENAI_API_KEY
#   3. pytest -m integration
#
# Option 2: Environment variable
#   OPENAI_API_KEY=sk-xxx pytest -m integration
#
# Option 3: CI/CD (GitHub Actions)
#   - Add OPENAI_API_KEY as a repository secret
#   - Tests will automatically use it
#
