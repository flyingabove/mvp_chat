        - img "Six Strangers" [ref=f2e169]
        - generic [ref=f2e170]: The last of the evening light is caught in the windows when you reach the house. Behind you, the residential street is quiet enough to hear the wheels of your suitcase catch on a seam in the pavement. Somewhere back toward Gotanda station, a train passes above the traffic.Through the glass, you can see a long table laid with plates that do not quite match. Someone is counting them, starting again, and pulling out another chair.You ring the bell.The woman who opens the door has pushed her sleeves back and is carrying a tea towel. She looks from you to the suitcase, then smiles.“Hi. You found it. I'm Mizuki.” She steps aside. “Come in — there's space for your shoes here. Well. There was this morning.”Seven pairs could fit if everyone moved something an inch. Mizuki nudges her own shoes out of the way first.“They've made up the little guest room for you,” she says. “The rest of us are sharing upstairs. I can show you after dinner, if you're hungry.”Beyond her, the living room opens into the kitchen and dining area. A young man in a T-shirt has a baseball resting against his knee; beside the sofa, a woman closes a magazine over one finger and looks toward the door. At the table, the person counting plates finally seems satisfied. From upstairs comes the brief rush of a hairdryer, then quiet.“Everyone's only just getting used to being here,” Mizuki says, a little more softly. “So you haven't missed much.”She leaves your suitcase beside the entry bench. The kettle clicks off behind her. Nobody calls for a speech, and nobody seems quite sure whether introductions should happen standing up or over dinner.Mizuki stays beside you, one hand resting on the back of the bench.“What should we call you? And — tea, coffee, or something cold?”
